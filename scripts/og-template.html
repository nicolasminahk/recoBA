<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: 'Clash Display';
    src: url('../public/fonts/ClashDisplay-Semibold.woff2') format('woff2');
    font-weight: 600;
  }
  @font-face {
    font-family: 'General Sans';
    src: url('../public/fonts/GeneralSans-Medium.woff2') format('woff2');
    font-weight: 500;
  }
  @font-face {
    font-family: 'General Sans';
    src: url('../public/fonts/GeneralSans-Semibold.woff2') format('woff2');
    font-weight: 600;
  }
  * { margin: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px;
    background: #F7F3EC;
    color: #16181D;
    font-family: 'General Sans', sans-serif;
    position: relative;
    overflow: hidden;
    background-image:
      linear-gradient(to right, rgba(22,24,29,0.06) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(22,24,29,0.06) 1px, transparent 1px);
    background-size: 72px 72px;
  }
  .wrap { padding: 64px 72px; height: 100%; display: flex; flex-direction: column; justify-content: space-between; width: 600px; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand span { font-family: 'Clash Display'; font-size: 32px; letter-spacing: 0.01em; }
  .eyebrow { font-size: 14px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: #C2603D; margin-bottom: 18px; }
  h1 {
    font-family: 'Clash Display';
    font-size: 54px;
    line-height: 1.04;
    letter-spacing: -0.02em;
  }
  h1 em { font-style: normal; color: #C2603D; }
  .sub { font-size: 18px; line-height: 1.45; color: rgba(22,24,29,0.7); margin-top: 22px; max-width: 470px; font-weight: 500; }
  .foot { font-size: 15px; color: #8D8578; letter-spacing: 0.04em; }
  .shot {
    position: absolute; right: -300px; top: 140px; width: 840px;
    border-radius: 14px; overflow: hidden; background: #fff;
    border: 1px solid rgba(22,24,29,0.12);
    box-shadow: 0 30px 80px -30px rgba(22,24,29,0.45);
    transform: rotate(-2deg);
  }
  .shot .bar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: #EFE9DF; border-bottom: 1px solid rgba(22,24,29,0.09); }
  .shot .bar i { width: 10px; height: 10px; border-radius: 50%; border: 1px solid rgba(22,24,29,0.2); display: block; }
  .shot .bar i:last-of-type { border-color: rgba(194,96,61,0.6); background: rgba(194,96,61,0.3); }
  .shot .bar b { flex: 1; text-align: center; font-weight: 500; font-size: 11px; color: rgba(22,24,29,0.5); background: #fff; border-radius: 999px; padding: 3px 12px; border: 1px solid rgba(22,24,29,0.1); }
  .shot img { display: block; width: 100%; }
</style>
</head>
<body>
  <div class="shot">
    <div class="bar"><i></i><i></i><i></i><b>gestion.recoba.casa/admin</b></div>
    <img src="../src/assets/shots/admin-obras.png" alt="" />
  </div>
  <div class="wrap">
    <div class="brand">
      <svg width="52" height="52" viewBox="0 0 64 64">
        <rect width="64" height="64" rx="12" fill="#16181D"/>
        <path d="M16 48 V34 a16 16 0 0 1 32 0 V48" fill="none" stroke="#C2603D" stroke-width="4.5" stroke-linecap="round"/>
        <line x1="12" y1="48" x2="52" y2="48" stroke="#F7F3EC" stroke-width="3.5" stroke-linecap="round"/>
      </svg>
      <span>reco<em style="font-style:normal;color:#C2603D">BA</em></span>
    </div>
    <div>
      <p class="eyebrow">Panel de seguimiento de obra e inversión</p>
      <h1>Cada obra, cada euro y cada inversor, <em>en un solo panel.</em></h1>
      <p class="sub">Se instala en las cuentas de su empresa y es suyo. Pago único, sin cuota obligatoria.</p>
    </div>
    <p class="foot">recoba.casa</p>
  </div>
</body>
</html>
