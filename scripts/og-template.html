<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: 'Clash Display';
    src: url('../public/fonts/ClashDisplay-Semibold.woff2') format('woff2');
    font-weight: 600;
  }
  @font-face {
    font-family: 'General Sans';
    src: url('../public/fonts/GeneralSans-Semibold.woff2') format('woff2');
    font-weight: 600;
  }
  * { margin: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px;
    background: #F7F3EC;
    color: #16181D;
    font-family: 'General Sans', sans-serif;
    position: relative;
    overflow: hidden;
    background-image:
      linear-gradient(to right, rgba(22,24,29,0.06) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(22,24,29,0.06) 1px, transparent 1px);
    background-size: 72px 72px;
  }
  .wrap { padding: 72px 80px; height: 100%; display: flex; flex-direction: column; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand span { font-family: 'Clash Display'; font-size: 32px; letter-spacing: 0.01em; }
  h1 {
    font-family: 'Clash Display';
    font-size: 74px;
    line-height: 1.05;
    letter-spacing: -0.02em;
    max-width: 820px;
  }
  h1 em { font-style: normal; color: #C2603D; }
  .foot { display: flex; gap: 56px; align-items: flex-end; }
  .stat b { display:block; font-family:'Clash Display'; font-size: 40px; font-variant-numeric: tabular-nums; }
  .stat i { display:block; font-style:normal; font-size: 15px; letter-spacing: 0.16em; text-transform: uppercase; color: #8D8578; margin-top: 6px; }
  .arcs { position:absolute; right: -20px; bottom: -8px; opacity: 0.9; }
</style>
</head>
<body>
  <svg class="arcs" width="360" height="300" viewBox="0 0 360 300" fill="none" stroke="#C2603D" stroke-width="2.5">
    <path d="M30 300 V210 a55 55 0 0 1 110 0 V300" />
    <path d="M170 300 V210 a55 55 0 0 1 110 0 V300" />
    <path d="M310 300 V210 a55 55 0 0 1 110 0 V300" />
    <line x1="0" y1="300" x2="360" y2="300" stroke="#16181D" />
  </svg>
  <div class="wrap">
    <div class="brand">
      <svg width="52" height="52" viewBox="0 0 64 64">
        <rect width="64" height="64" rx="12" fill="#16181D"/>
        <path d="M16 48 V34 a16 16 0 0 1 32 0 V48" fill="none" stroke="#C2603D" stroke-width="4.5" stroke-linecap="round"/>
        <line x1="12" y1="48" x2="52" y2="48" stroke="#F7F3EC" stroke-width="3.5" stroke-linecap="round"/>
      </svg>
      <span>reco<em style="font-style:normal;color:#C2603D">BA</em></span>
    </div>
    <h1>Flipping en Buenos Aires: comprar bien, transformar, <em>vender mejor</em></h1>
    <div class="foot">
      <div class="stat"><b>US$ 27.800</b><i>desde · por inversor</i></div>
      <div class="stat"><b>6 %</b><i>renta preferente anual · USD</i></div>
      <div class="stat"><b>9–12 %</b><i>TIR objetivo · 5 años</i></div>
    </div>
  </div>
</body>
</html>
